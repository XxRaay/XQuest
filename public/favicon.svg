<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="orbGrad" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#5865F2"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#06070a"/>
  <rect width="32" height="32" rx="8" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>
  <!-- Central Crystal Orb -->
  <polygon points="16,5 24,10 24,20 16,27 8,20 8,10" stroke="url(#orbGrad)" stroke-width="1.75" stroke-linejoin="round" fill="rgba(56, 189, 248, 0.12)"/>
  <!-- Inner Facets -->
  <polyline points="16,5 16,27" stroke="url(#orbGrad)" stroke-width="1.2" stroke-linecap="round"/>
  <polyline points="8,10 16,15 24,10" stroke="url(#orbGrad)" stroke-width="1.2" stroke-linejoin="round"/>
  <polyline points="8,20 16,15 24,20" stroke="url(#orbGrad)" stroke-width="1.2" stroke-linejoin="round"/>
