name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза без префикса v (например 1.0.1). Пусто — берётся из package.json"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve version and tag
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          VERSION_INPUT="${INPUT_VERSION:-}"
          VERSION_INPUT="${VERSION_INPUT#v}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$VERSION_INPUT" ]; then
            if ! [[ "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid version '$VERSION_INPUT'. Expected semver, e.g. 1.2.3"
              exit 1
            fi
            npm version "$VERSION_INPUT" --no-git-tag-version --allow-same-version
          fi

          VERSION="$(node -p "require('./package.json').version")"

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::Tag '$TAG' does not match package.json version '$VERSION'. Run 'npm version patch' before tagging."
              exit 1
            fi
          else
            TAG="v$VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG (version $VERSION)"

      - name: Install dependencies
        run: npm ci

      - name: Build installer and portable package
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify build artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release
          if [ -z "$(find release -maxdepth 1 -name '*.exe' -print -quit)" ]; then
            echo "::error::No .exe artifacts were produced"
            exit 1
          fi

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: xquest-windows-${{ steps.meta.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.blockmap

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: XQuest ${{ steps.meta.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
